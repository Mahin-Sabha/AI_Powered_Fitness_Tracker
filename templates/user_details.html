<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - FitMotion AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 20px 15px;
        }
        
        .auth-box {
            background: var(--card);
            border-radius: 12px;
            padding: 28px 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 16px 40px rgba(30,40,60,0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
        }
        
        .auth-box h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.65rem;
        }
        
        .auth-box p {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.08);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .btn-submit {
            width: 100%;
            padding: 11px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        
        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .btn-skip {
            width: 100%;
            padding: 11px;
            background: transparent;
            color: var(--text-light);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }
        
        .btn-skip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .flash-messages {
            margin-bottom: 16px;
        }
        
        .flash {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .flash.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .flash.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        
        .welcome-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.05rem;
        }
        
        .welcome-badge i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="welcome-badge">
                <i class="fas fa-check-circle"></i>
                Welcome, {{ username }}!
            </div>
            
            <h1>Complete Your Profile</h1>
            <p>Help us personalize your fitness experience</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <form method="POST" action="{{ url_for('user_details') }}">
                <div class="form-row">
                    <div class="form-group">
                        <label for="age">
                            <i class="fas fa-birthday-cake"></i> Age
                        </label>
                        <input type="number" id="age" name="age" min="13" max="120" placeholder="e.g., 25">
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">
                            <i class="fas fa-user"></i> Gender
                        </label>
                        <select id="gender" name="gender">
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer_not_to_say">Prefer not to say</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="height">
                            <i class="fas fa-ruler-vertical"></i> Height (cm)
                        </label>
                        <input type="number" id="height" name="height" min="100" max="250" step="0.1" placeholder="e.g., 170">
                    </div>
                    
                    <div class="form-group">
                        <label for="weight">
                            <i class="fas fa-weight"></i> Weight (kg)
                        </label>
                        <input type="number" id="weight" name="weight" min="30" max="300" step="0.1" placeholder="e.g., 70">
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-arrow-right"></i> Continue to Trainer
                </button>
                
                <button type="submit" name="skip" value="true" class="btn-skip">
                    Skip for now
                </button>
            </form>
        </div>
    </div>
</body>
</html>
